#
#   All available Hugo versions are listed under https://github.com/gohugoio/hugo/pkgs/container/hugo.
#
image:
  name: ghcr.io/gohugoio/hugo:v0.169.0
  # The image entrypoint runs hugo directly; let GitLab run the job script instead.
  entrypoint: [""]

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # The image runs as the unprivileged "hugo" user: hand it the build directory
  # instead of relying on umask 0000, so it can write public/ and git trusts the repo.
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"

stages:
  - build

pages:
  stage: build
  script:
    - hugo
    - cp public/en/404.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: production
