when:
  event:
    - push
    - tag
    - cron

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  # The Hugo image runs as the unprivileged "hugo" user (uid 1000): hand it the
  # workspace cloned as root, so it can write public/ and git trusts the repo.
  - name: chown
    image: alpine
    commands:
      - chown -R 1000:1000 .

  # All available Hugo versions are listed under https://github.com/gohugoio/hugo/pkgs/container/hugo.
  - name: build
    image: ghcr.io/gohugoio/hugo:v0.168.0
    commands:
      - hugo
      - cp public/en/404.html public/404.html
    environment:
      HUGO_ENVIRONMENT: production

  # Check every link of the generated site; settings live in lychee.toml.
  - name: check-links
    image: lycheeverse/lychee:0.24-alpine
    commands:
      - >-
        lychee --config lychee.toml
        --root-dir "$CI_WORKSPACE/public"
        --remap "https://help\.happydomain\.org/ file://$CI_WORKSPACE/public/"
        'public/**/*.html'
